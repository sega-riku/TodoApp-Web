<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        .form-control::placeholder {
            color: #b8b8b8;
            opacity: 1;
        }
    </style>

    <title>パスワード変更</title>
</head>

<body>

    <div class="container py-5">

        <div
            class="mx-auto"
            style="max-width: 600px;">

            <h1 class="text-center mb-4">
                パスワード変更
            </h1>

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <!-- 現在のパスワードエラー -->
                    <div
                        th:if="${currentPasswordError}"
                        class="alert alert-danger text-center"
                        th:text="${currentPasswordError}">
                    </div>

                    <!-- 8文字未満エラー -->
                    <div
                        th:if="${passwordLengthError}"
                        class="alert alert-danger text-center"
                        th:text="${passwordLengthError}">
                    </div>

                    <!-- 英字なしエラー -->
                    <div
                        th:if="${passwordLetterError}"
                        class="alert alert-danger text-center"
                        th:text="${passwordLetterError}">
                    </div>

                    <!-- 数字なしエラー -->
                    <div
                        th:if="${passwordNumberError}"
                        class="alert alert-danger text-center"
                        th:text="${passwordNumberError}">
                    </div>

                    <!-- パスワード不一致エラー -->
                    <div
                        th:if="${passwordError}"
                        class="alert alert-danger text-center"
                        th:text="${passwordError}">
                    </div>

                    <form
                        th:action="@{/password/change}"
                        method="post">

                        <!-- 現在のパスワード -->
                        <div class="mb-3">

                            <label
                                for="currentPassword"
                                class="form-label">
                                現在のパスワード
                            </label>

                            <div class="input-group">

                                <input
                                    type="password"
                                    id="currentPassword"
                                    name="currentPassword"
                                    class="form-control"
                                    required>

                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    onclick="togglePassword('currentPassword', this)">
                                    表示
                                </button>

                            </div>

                        </div>

                        <!-- 新しいパスワード -->
                        <div class="mb-3">

                            <label
                                for="newPassword"
                                class="form-label">
                                新しいパスワード
                            </label>

                            <div class="input-group">

                                <input
                                    type="password"
                                    id="newPassword"
                                    name="newPassword"
                                    class="form-control"
                                    placeholder="英数字8文字以上で入力してください"
                                    required>

                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    onclick="togglePassword('newPassword', this)">
                                    表示
                                </button>

                            </div>

                        </div>

                        <!-- 新しいパスワード確認 -->
                        <div class="mb-4">

                            <label
                                for="confirmPassword"
                                class="form-label">
                                新しいパスワード（確認）
                            </label>

                            <div class="input-group">

                                <input
                                    type="password"
                                    id="confirmPassword"
                                    name="confirmPassword"
                                    class="form-control"
                                    placeholder="もう一度パスワードを入力してください"
                                    required>

                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    onclick="togglePassword('confirmPassword', this)">
                                    表示
                                </button>

                            </div>

                        </div>

                        <!-- ボタン -->
                        <div class="d-flex justify-content-center gap-3">

                            <button
                                type="submit"
                                class="btn btn-primary"
                                style="width: 140px;">
                                変更
                            </button>

                            <a
                                th:href="@{/}"
                                class="btn btn-outline-secondary"
                                style="width: 140px;">
                                戻る
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <!-- パスワード表示・非表示 -->
    <script>
        function togglePassword(inputId, button) {

            const input =
                document.getElementById(inputId);

            if (input.type === "password") {

                input.type = "text";
                button.textContent = "隠す";

            } else {

                input.type = "password";
                button.textContent = "表示";
            }
        }
    </script>

</body>

</html>
