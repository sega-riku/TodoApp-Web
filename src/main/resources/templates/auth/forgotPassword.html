<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        .form-control::placeholder {
            color: #b8b8b8;
            opacity: 1;
        }

        @media(max-width: 991.98px) {
            .forgot-password-page {
                padding-top: 11rem !important;
            }
        }
    </style>

    <title>パスワード再設定 - Tascale</title>
</head>

<body>

    <div class="container py-5 forgot-password-page">

        <div
            class="mx-auto"
            style="max-width: 600px;">

            <h1 class="text-center mb-4">
                パスワード再設定
            </h1>

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <!--説明-->
                    <p
                        class="text-secondary mb-4"
                        th:if="${mailSent == null}">
                        登録しているメールアドレスを入力してください。<br>
                        パスワード再設定用のURLをメールでお送りします。
                    </p>

                    <!--メールアドレスエラー-->
                    <div
                        th:if="${emailError}"
                        class="alert alert-danger text-center"
                        th:text="${emailError}">
                    </div>

                    <!--メール送信エラー-->
                    <div
                        th:if="${mailError}"
                        class="alert alert-danger text-center"
                        th:text="${mailError}">
                    </div>

                    <!--送信完了-->
                    <div
                        th:if="${mailSent}"
                        class="alert alert-success">

                        <p class="mb-2">
                            入力されたメールアドレスに
                            パスワード再設定メールを送信しました。
                        </p>

                        <p class="mb-0">
                            メールが届かない場合は
                            迷惑メールフォルダもご確認ください。
                        </p>
                    </div>

                    <!--再設定申請フォーム-->
                    <form
                        th:if="${mailSent == null}"
                        th:action="@{/password/forgot}"
                        method="post">

                        <div class="mb-4">

                            <label
                                for="email"
                                class="form-label">
                                メールアドレス
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="form-control"
                                placeholder="example@example.com"
                                required>

                        </div>

                        <div class="d-flex justify-content-center gap-3">

                            <button
                                type="submit"
                                class="btn btn-primary"
                                style="width: 140px;">
                                送信
                            </button>

                            <a
                                th:href="@{/login}"
                                class="btn btn-outline-secondary"
                                style="width: 140px;">
                                戻る
                            </a>

                        </div>

                    </form>

                    <!--送信後-->
                    <div
                        th:if="${mailSent}"
                        class="text-center mt-4">

                        <a
                            th:href="@{/login}"
                            class="btn btn-outline-secondary">
                            ログイン画面へ戻る
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
