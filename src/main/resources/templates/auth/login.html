<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <title>ログイン</title>

    <style>
        @media (max-width: 991.98px) {

            .login-page {
                padding-top: 11rem !important;
            }
        }
    </style>
</head>

<body>

    <div class="container py-5 login-page">

        <!-- 横幅を制限して中央配置 -->
        <div
            class="mx-auto"
            style="max-width: 600px;">

            <!-- タイトル -->
            <h1 class="text-center mb-4">
                ログイン
            </h1>

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <div
                        th:if="${param.error}"
                        class="alert alert-danger text-center">
                        ユーザー名またはパスワードが正しくありません
                    </div>

                    <div
                        th:if="${param.registered}"
                        class="alert alert-success text-center">
                        ユーザー登録が完了しました
                    </div>

                    <div
                        th:if="${param.logout}"
                        class="alert alert-success text-center">
                        ログアウトしました
                    </div>

                    <form
                        th:action="@{/login}"
                        method="post">

                        <!-- ユーザー名 -->
                        <div class="mb-3">

                            <label
                                for="username"
                                class="form-label">
                                ユーザー名
                            </label>

                            <input
                                type="text"
                                id="username"
                                name="username"
                                class="form-control"
                                required>

                        </div>

                        <!-- パスワード -->
                        <div class="mb-4">

                            <label
                                for="password"
                                class="form-label">
                                パスワード
                            </label>

                            <div class="input-group">

                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    class="form-control"
                                    required>

                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    onclick="togglePassword('password',this)">
                                    表示
                                </button>
                            </div>

                        </div>

                        <!-- ボタンエリア -->
                        <div class="d-grid mb-3">

                            <button
                                type="submit"
                                class="btn btn-primary">
                                ログイン
                            </button>

                        </div>

                        <div class="text-center">

                            <span class="text-secondary">
                                アカウントをお持ちでない方
                            </span>

                            <a
                                th:href="@{/register}"
                                class="ms-2">
                                新規登録はこちら
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>
    <!--パスワード表示ボタン-->
    <script>
        function togglePassword(inputId, button) {

            const input =
                document.getElementById(inputId);

            if (input.type === "password") {

                input.type = "text";
                button.textContent = "隠す";

            } else {

                input.type = "password";
                button.textContent = "表示";
            }
        }
    </script>

</body>

</html>
