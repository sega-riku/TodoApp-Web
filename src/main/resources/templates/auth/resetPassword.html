<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        .form-control::placeholder {
            color: #b8b8b8;
            opacity: 1;
        }

        @media(max-width: 991.98px) {
            .reset-password-page {
                padding-top: 11rem !important;
            }
        }
    </style>

    <title>パスワード再設定 - Tascale</title>
</head>

<body>

    <div class="container py-5 reset-password-page">

        <div
            class="mx-auto"
            style="max-width: 600px;">

            <h1 class="text-center mb-4">
                パスワード再設定
            </h1>

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <!--トークンエラー-->
                    <div
                        th:if="${tokenError}"
                        class="alert alert-danger text-center"
                        th:text="${tokenError}">
                    </div>

                    <!--トークンエラー時-->
                    <div
                        th:if="${tokenError}"
                        class="text-center">

                        <a
                            th:href="@{/password/forgot}"
                            class="btn btn-outline-secondary">
                            再設定メールを再送する
                        </a>

                    </div>

                    <div
                        th:if="${passwordError}"
                        class="alert alert-danger text-center"
                        th:text="${passwordError}">
                    </div>

                    <!--再設定フォーム-->
                    <form
                        th:if="${tokenError == null}"
                        th:action="@{/password/reset}"
                        method="post">

                        <!--トークン-->
                        <input
                            type="hidden"
                            name="token"
                            th:value="${token}">

                        <!--新しいパスワード-->
                        <div class="mb-3">

                            <label
                                for="newPassword"
                                class="form-label">
                                新しいパスワード
                            </label>

                            <div class="input-group">

                                <input
                                    type="password"
                                    id="newPassword"
                                    name="newPassword"
                                    class="form-control"
                                    placeholder="英数字8文字以上で入力してください"
                                    required>

                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    onclick="togglePassword('newPassword', this)">
                                    表示
                                </button>

                            </div>

                        </div>

                        <!--新しいパスワード確認-->
                        <div class="mb-4">

                            <label
                                for="confirmPassword"
                                class="form-label">
                                新しいパスワード（確認）
                            </label>

                            <div class="input-group">

                                <input
                                    type="password"
                                    id="confirmPassword"
                                    name="confirmPassword"
                                    class="form-control"
                                    placeholder="もう一度パスワードを入力してください"
                                    required>

                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    onclick="togglePassword('confirmPassword', this)">
                                    表示
                                </button>

                            </div>

                        </div>

                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-primary">
                                パスワードを変更
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <!--パスワード表示・非表示処理-->
    <script>
        function togglePassword(inputId, button) {

            const input =
                document.getElementById(inputId);

            if (input.type === "password") {

                input.type = "text";
                button.textContent = "隠す";

            } else {

                input.type = "password";
                button.textContent = "表示";
            }
        }
    </script>

</body>

</html>
