<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        .form-control::placeholder {
            color: #b8b8b8;
            opacity: 1;
        }

        @media(max-width:991.98px){
            .register-page{
                padding-top: 11rem !important;
            }
        }
    </style>

    <title>ユーザー新規登録</title>
</head>

<body>

    <div class="container py-5 register-page">

        <div
            class="mx-auto"
            style="max-width: 600px;">

            <h1 class="text-center mb-4">
                ユーザー新規登録
            </h1>

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <div
                        th:if="${usernameError}"
                        class="alert alert-danger text-center"
                        th:text="${usernameError}">
                    </div>

                    <div
                        th:if="${usernameDuplicateError}"
                        class="alert alert-danger text-center"
                        th:text="${usernameDuplicateError}">
                    </div>

                    <div
                        th:if="${emailError}"
                        class="alert alert-danger text-center"
                        th:text="${emailError}">
                    </div>

                    <div
                        th:if="${emailFormatError}"
                        class="alert alert-danger text-center"
                        th:text="${emailFormatError}">
                    </div>

                    <div
                        th:if="${emailDuplicateError}"
                        class="alert alertdanger text-center"
                        th:text="${emailDeplicateError}">
                    </div>

                    <div
                        th:if="${passwordLengthError}"
                        class="alert alert-danger text-center"
                        th:text="${passwordLengthError}">
                    </div>

                    <div
                        th:if="${passwordLetterError}"
                        class="alert alert-danger text-center"
                        th:text="${passwordLetterError}">
                    </div>

                    <div
                        th:if="${passwordNumberError}"
                        class="alert alert-danger text-center"
                        th:text="${passwordNumberError}">
                    </div>

                    <div
                        th:if="${passwordError}"
                        class="alert alert-danger text-center"
                        th:text="${passwordError}">
                    </div>

                    <form
                        th:action="@{/register}"
                        method="post">

                        <!--ユーザー名-->
                        <div class="mb-3">

                            <label
                                for="username"
                                class="form-label">
                                ユーザー名
                            </label>

                            <input
                                type="text"
                                id="username"
                                name="username"
                                class="form-control"
                                th:value="${enteredUsername}"
                                required>

                        </div>

                        <!--メールアドレス-->
                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label">
                                メールアドレス
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="form-control"
                                th:value="${enteredEmail}"
                                placeholder="example@example.com"
                                required>

                        </div>

                        <!--パスワード-->
                        <div class="mb-3">

                            <label
                                for="password"
                                class="form-label">
                                パスワード
                            </label>

                            <div class="input-group">

                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    class="form-control"
                                    placeholder="英数字8文字以上で入力してください"
                                    required>

                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    onclick="togglePassword('password', this)">
                                    表示
                                </button>

                            </div>

                        </div>

                        <!--パスワード確認-->
                        <div class="mb-4">

                            <label
                                for="confirmPassword"
                                class="form-label">
                                パスワード(確認)
                            </label>

                            <div class="input-group">

                                <input
                                    type="password"
                                    id="confirmPassword"
                                    name="confirmPassword"
                                    class="form-control"
                                    placeholder="もう一度パスワードを入力してください"
                                    required>

                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    onclick="togglePassword('confirmPassword', this)">
                                    表示
                                </button>

                            </div>

                        </div>

                        <div class="d-flex justify-content-center gap-3">

                            <button
                                type="submit"
                                class="btn btn-success"
                                style="width: 140px;">
                                登録
                            </button>

                            <a
                                th:href="@{/login}"
                                class="btn btn-outline-secondary"
                                style="width: 140px;">
                                戻る
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <!--パスワード表示ボタン-->
    <script>
        function togglePassword(inputId, button) {

            const input =
                document.getElementById(inputId);

            if (input.type === "password") {

                input.type = "text";
                button.textContent = "隠す";

            } else {

                input.type = "password";
                button.textContent = "表示";
            }
        }
    </script>

</body>

</html>
