<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <title>管理画面</title>
</head>

<body>

    <div class="container py-4">

        <!--ヘッダー-->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <h1 class="mb-0">
                管理画面
            </h1>

            <div class="d-flex align-items-center gap-3">

                <span>
                    <span th:text="${username}">
                        ユーザー名
                    </span>
                    さん
                </span>

                <form
                    th:action="@{/logout}"
                    method="post"
                    class="mb-0">

                    <button
                        type="submit"
                        class="btn btn-outline-secondary">
                        ログアウト
                    </button>

                </form>

            </div>

        </div>

        <div class="row">

            <div class="col-12 col-lg-8">

                <h3 class="mb-3">
                    ユーザー管理
                </h3>

                <div class="card">

                    <div class="card-body">

                        <table class="table align-middle">

                            <thead>

                                <tr>
                                    <th>ユーザー名</th>
                                    <th>ロール</th>
                                    <th>登録日</th>
                                    <th>操作</th>
                                </tr>

                            </thead>

                            <tbody>

                                <tr th:each="user : ${users}">

                                    <td th:text="${user.username}">
                                        user
                                    </td>

                                    <td th:text="${user.role}">
                                        USER
                                    </td>

                                    <td
                                        th:text="${user.createdAt != null
                                            ? #temporals.format(user.createdAt, 'yyyy/MM/dd HH:mm')
                                            : '-'}">
                                        2026/08/20 14:30
                                    </td>

                                    <td>

                                        <a
                                            class="btn btn-outline-primary btn-sm"
                                            th:href="@{/admin/users/{id}(id=${user.id})}">
                                            詳細
                                        </a>

                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

            <div class="col-12 col-lg-4">

                <h3 class="mb-3">
                    管理サマリー
                </h3>

                <!--ユーザー数管理サマリ-->
                <div class="card mb-3">
                    <div class="card-body">

                        <div class="text-secondary mb-1">
                            👥 総ユーザー数
                        </div>

                        <div class="fs-2 fw-bold">
                            <span th:text="${totalUsers}">0</span>人
                        </div>

                    </div>
                </div>

                <!--管理者数管理サマリ-->
                <div class="card mb-3">
                    <div class="card-body">

                        <div class="text-secondary mb-1">
                            💻 管理者(ADMIN)
                        </div>

                        <div class="fs-2 fw-bold">
                            <span th:text="${adminCount}">0</span>人
                        </div>

                    </div>
                </div>

                <!--ユーザー管理サマリ-->
                <div class="card mb-3">
                    <div class="card-body">

                        <div class="text-secondary mb-1">
                            👤 ユーザー(USER)
                        </div>

                        <div class="fs-2 fw-bold">
                            <span th:text="${userCount}">0</span>人
                        </div>

                    </div>
                </div>

            </div>

        </div>

    </div>

</body>

</html>
