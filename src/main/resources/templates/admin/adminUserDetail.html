<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <title>ユーザー詳細</title>
</head>

<body>

    <div class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h1 class="mb-0">
                ユーザー詳細
            </h1>

            <div class="d-flex align-items-center gap-3">

                <span>
                    <span th:text="${username}">
                        ユーザー名
                    </span>
                    さん
                </span>

                <form
                    th:action="@{/logout}"
                    method="post"
                    class="mb-0">

                    <button
                        type="submit"
                        class="btn btn-outline-secondary">
                        ログアウト
                    </button>

                </form>

            </div>

        </div>

        <div
            class="mx-auto"
            style="max-width: 700px;">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <div class="mb-3">

                        <div class="text-secondary">
                            ユーザーID
                        </div>

                        <div
                            class="fs-5"
                            th:text="${user.id}">
                            1
                        </div>

                    </div>

                    <hr>

                    <div class="mb-3">

                        <div class="text-secondary">
                            ユーザー名
                        </div>

                        <div
                            class="fs-5"
                            th:text="${user.username}">
                            user1
                        </div>

                    </div>

                    <hr>

                    <div class="mb-3">

                        <div class="text-secondary">
                            ロール
                        </div>

                        <div
                            class="fs-5"
                            th:text="${user.role}">
                            USER
                        </div>

                    </div>

                    <hr>

                    <div class="mb-4">

                        <div class="text-secondary">
                            登録日時
                        </div>

                        <div
                            class="fs-5"
                            th:text="${user.createdAt != null
                                ? #temporals.format(
                                    user.createdAt,
                                    'yyyy/MM/dd HH:mm'
                                )
                                : '-'}">
                            2026/08/20 15:30
                        </div>

                    </div>

                    <div class="d-flex justify-content-between align-items-center">

                        <a
                            th:href="@{/admin}"
                            class="btn btn-secondary">
                            一覧へ戻る
                        </a>

                        <div class="d-flex gap-2">

                            <button
                                type="button"
                                class="btn btn-warning">
                                パスワード初期化
                            </button>

                            <button
                                type="button"
                                class="btn btn-danger"
                                data-bs-toggle="modal"
                                data-bs-target="#deleteUserModal">
                                ユーザー削除
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!--ユーザー削除確認モーダル-->
    <div
        class="modal fade"
        id="deleteUserModal"
        tabindex="-1"
        aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        ユーザー削除
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="閉じる">
                    </button>

                </div>

                <div class="modal-body">

                    <p>
                        以下のユーザーを削除しますか？
                    </p>

                    <p
                        class="fw-bold mb-1"
                        th:text="${user.username}">
                        ユーザー名
                    </p>

                    <p class="mb-1">
                        ロール：
                        <span th:text="${user.role}">
                            USER
                        </span>
                    </p>

                    <p class="text-danger mb-0 mt-3">
                        削除すると元に戻せません。
                    </p>

                </div>

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                        キャンセル
                    </button>

                    <a
                        class="btn btn-danger"
                        th:href="@{/admin/users/delete/{id}(id=${user.id})}">
                        削除
                    </a>

                </div>

            </div>

        </div>

    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
