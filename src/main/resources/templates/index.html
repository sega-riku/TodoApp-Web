<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <title>Todoアプリメイン画面</title>
</head>

<body>

    <div class="container py-4">

        <h1
            class="mb-4"
            th:text="${title}">
            Todo一覧
        </h1>

        <div class="row">

            <!-- タスク一覧 -->
            <div class="col-12 col-lg-8 mb-4 mb-lg-0">

                <form
                    action="/"
                    method="get"
                    class="mb-4">

                    <!-- 検索 -->
                    <div class="row g-2 align-items-end mb-3">

                        <div class="col-9">

                            <label class="form-label">
                                タスク検索
                            </label>

                            <input
                                type="text"
                                name="keyword"
                                class="form-control"
                                placeholder="検索ワードを入力"
                                th:value="${keyword}">

                        </div>

                        <div class="col-3">

                            <button
                                type="submit"
                                class="btn btn-primary w-100">
                                検索
                            </button>

                        </div>

                    </div>

                    <!-- 並び順・表示・タスク追加 -->
                    <div class="row g-2 align-items-end">

                        <!-- 並び順 -->
                        <div class="col-4">

                            <label class="form-label">
                                並び順
                            </label>

                            <label class="form-control bg-light">
                                締切順
                            </label>

                        </div>

                        <!-- 表示 -->
                        <div class="col-5">

                            <label class="form-label">
                                表示
                            </label>

                            <select
                                name="status"
                                class="form-select"
                                onchange="this.form.submit()">

                                <option
                                    value="all"
                                    th:selected="${status == null || status == 'all'}">
                                    すべて
                                </option>

                                <option
                                    value="incomplete"
                                    th:selected="${status == 'incomplete'}">
                                    未完了のみ
                                </option>

                                <option
                                    value="completed"
                                    th:selected="${status == 'completed'}">
                                    完了のみ
                                </option>

                            </select>

                        </div>

                        <!-- タスク追加 -->
                        <div class="col-3">

                            <a
                                class="btn btn-success w-100"
                                th:href="@{/add}">
                                ＋ タスク追加
                            </a>

                        </div>

                    </div>

                </form>

                <!-- 件数表示 -->
                <p>
                    表示中：
                    <span th:text="${displayedCount}"></span>件
                    /
                    全<span th:text="${totalCount}"></span>件
                </p>


                <p th:if="${taskGroups.isEmpty()}">
                    該当するタスクはありません。
                </p>

                <div
                    th:each="group : ${taskGroups}"
                    class="card mb-3">

                    <div class="card-body">

                        <!-- タスク名 -->
                        <h5
                            class="card-title mb-2"
                            th:text="${group.title}">
                            タスク名
                        </h5>

                        <!-- 予定・締切＋日付 -->
                        <p class="card-text mb-3">

                            <span
                                th:text="${group.tasks.get(0).dateType
                                    == T(com.sega.todoappweb.DateType).SCHEDULE
                                    ? '📅 予定：'
                                    : '⏰ 締切：'}">
                            </span>

                            <span th:text="${group.deadline}">
                                2026-08-31
                            </span>

                        </p>

                        <div
                            th:each="task, stat : ${group.tasks}">

                            <!-- 2件目以降は区切り線 -->
                            <hr
                                class="my-2"
                                th:if="${!stat.first}">

                            <div class="d-flex justify-content-between align-items-center">

                                <!-- 時間・詳細 -->
                                <div>

                                    <span th:text="${task.time}">
                                        10:00
                                    </span>

                                    <span
                                        class="ms-2"
                                        th:if="${task.description != null
                                            && !task.description.isBlank()}"
                                        th:text="${task.description}">
                                        詳細
                                    </span>

                                </div>

                                <!-- 個別操作 -->
                                <div class="d-flex">

                                    <!-- 編集 -->
                                    <a
                                        class="btn btn-info text-white btn-sm me-2"
                                        th:href="@{/edit/{id}(id=${task.id})}">
                                        編集
                                    </a>

                                    <!-- 削除 -->
                                    <button
                                        type="button"
                                        class="btn btn-danger btn-sm"
                                        data-bs-toggle="modal"
                                        th:data-bs-target="'#deleteModal' + ${task.id}">
                                        削除
                                    </button>

                                </div>

                            </div>

                            <div
                                class="modal fade"
                                th:id="'deleteModal' + ${task.id}"
                                tabindex="-1"
                                aria-hidden="true">

                                <div class="modal-dialog modal-dialog-centered">

                                    <div class="modal-content">

                                        <div class="modal-header">

                                            <h5 class="modal-title">
                                                タスク削除
                                            </h5>

                                            <button
                                                type="button"
                                                class="btn-close"
                                                data-bs-dismiss="modal"
                                                aria-label="閉じる">
                                            </button>

                                        </div>

                                        <div class="modal-body">

                                            <p>
                                                以下の予定・締切を削除しますか？
                                            </p>

                                            <p
                                                class="fw-bold mb-1"
                                                th:text="${group.title}">
                                                タスク名
                                            </p>

                                            <p class="mb-1">

                                                <span th:text="${task.time}">
                                                    10:00
                                                </span>

                                                <span
                                                    class="ms-2"
                                                    th:if="${task.description != null
                                                        && !task.description.isBlank()}"
                                                    th:text="${task.description}">
                                                    詳細
                                                </span>

                                            </p>

                                            <p class="text-danger mb-0 mt-3">
                                                削除すると元に戻せません。
                                            </p>

                                        </div>

                                        <div class="modal-footer">

                                            <button
                                                type="button"
                                                class="btn btn-secondary"
                                                data-bs-dismiss="modal">
                                                キャンセル
                                            </button>

                                            <a
                                                class="btn btn-danger"
                                                th:href="@{/delete/{id}(id=${task.id})}">
                                                削除
                                            </a>

                                        </div>

                                    </div>

                                </div>

                            </div>

                        </div>

                        <div
                            class="d-flex justify-content-between align-items-center mt-3">

                            <!-- ステータス -->
                            <span
                                class="badge"
                                th:classappend="${group.tasks.get(0).completed
                                    ? ' text-bg-success'
                                    : ' text-bg-secondary'}"
                                th:text="${group.tasks.get(0).completed
                                    ? '完了'
                                    : '未完了'}">
                            </span>

                            <div>

                                <!-- グループ一括完了 -->
                                <a
                                    class="btn btn-success btn-sm"
                                    style="width: 100px;"
                                    th:if="${!group.tasks.get(0).completed}"
                                    th:href="@{/complete/group/{id}(id=${group.tasks.get(0).id})}">
                                    完了
                                </a>

                                <!-- グループ一括未完了 -->
                                <a
                                    class="btn btn-secondary btn-sm"
                                    style="width: 100px;"
                                    th:if="${group.tasks.get(0).completed}"
                                    th:href="@{/incomplete/group/{id}(id=${group.tasks.get(0).id})}">
                                    未完了に戻す
                                </a>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

            <div class="col-12 col-lg-4">

                <h3 class="mb-4">
                    予定・締切
                </h3>

                <div class="mb-5">

                    <h4 class="mb-3">
                        📅 予定
                    </h4>

                    <!-- 予定がない場合 -->
                    <p
                        class="text-secondary"
                        th:if="${scheduleDateGroups.isEmpty()}">
                        今後の予定はありません。
                    </p>

                    <div
                        th:each="dateGroup : ${scheduleDateGroups}"
                        class="border rounded p-3 mb-3">

                        <!-- 日付 -->
                        <h5
                            class="mb-3"
                            th:text="${#temporals.format(
                                dateGroup.deadline,
                                'M月d日'
                            )}">
                            8月31日
                        </h5>

                        <div th:each="group, stat : ${dateGroup.groups}">

                            <!-- 別タスク名なら区切り線 -->
                            <hr
                                class="my-3"
                                th:if="${!stat.first}">

                            <div th:if="${group.tasks.size() == 1}">

                                <div>

                                    <span>
                                        📅
                                    </span>

                                    <span th:text="${group.tasks.get(0).time}">
                                        10:00
                                    </span>

                                    <span
                                        class="ms-2 fw-semibold"
                                        th:text="${group.title}">
                                        タスク名
                                    </span>

                                </div>

                                <!-- 詳細 -->
                                <div
                                    class="ms-4 mt-1"
                                    th:if="${group.tasks.get(0).description != null
                                        && !group.tasks.get(0).description.isBlank()}">

                                    <span>
                                        📝
                                    </span>

                                    <span th:text="${group.tasks.get(0).description}">
                                        詳細
                                    </span>

                                </div>

                                <!-- 時間・詳細追加ボタン -->
                                <div class="mt-2 ms-4">

                                    <a
                                        class="btn btn-outline-success btn-sm"
                                        th:href="@{/schedule/add/{id}(id=${group.tasks.get(0).id})}">
                                        ＋ 時間・詳細を追加
                                    </a>

                                </div>

                            </div>

                            <div th:if="${group.tasks.size() > 1}">

                                <!-- タスク名 -->
                                <div class="fw-semibold mb-1">

                                    <span>
                                        📅
                                    </span>

                                    <span th:text="${group.title}">
                                        タスク名
                                    </span>

                                </div>

                                <!-- 時間・詳細一覧 -->
                                <div
                                    class="ms-4"
                                    th:each="task : ${group.tasks}">

                                    <div>

                                        <span th:text="${task.time}">
                                            10:00
                                        </span>

                                        <span
                                            class="ms-2"
                                            th:if="${task.description != null
                                                && !task.description.isBlank()}"
                                            th:text="${task.description}">
                                            詳細
                                        </span>

                                    </div>

                                </div>

                                <!-- 時間・詳細追加ボタン -->
                                <div class="mt-2 ms-4">

                                    <a
                                        class="btn btn-outline-success btn-sm"
                                        th:href="@{/schedule/add/{id}(id=${group.tasks.get(0).id})}">
                                        ＋ 時間・詳細を追加
                                    </a>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

                <div>

                    <h4 class="mb-3">
                        ⏰ 締切
                    </h4>

                    <!-- 締切がない場合 -->
                    <p
                        class="text-secondary"
                        th:if="${deadlineDateGroups.isEmpty()}">
                        締切はありません。
                    </p>

                    <div
                        th:each="dateGroup : ${deadlineDateGroups}"
                        class="border rounded p-3 mb-3">

                        <!-- 日付 -->
                        <h5
                            class="mb-3"
                            th:text="${#temporals.format(
                                dateGroup.deadline,
                                'M月d日'
                            )}">
                            8月31日
                        </h5>

                        <div th:each="group, stat : ${dateGroup.groups}">

                            <!-- 別タスク名なら区切り線 -->
                            <hr
                                class="my-3"
                                th:if="${!stat.first}">

                            <div th:if="${group.tasks.size() == 1}">

                                <div
                                    class="rounded p-2"
                                    th:with="task=${group.tasks.get(0)}"
                                    th:classappend="${
                                        task.expired
                                            ? ' bg-danger text-white'
                                            : task.deadline.isEqual(today)
                                                ? ' bg-danger-subtle text-danger-emphasis'
                                                : !task.deadline.isAfter(threeDaysLater)
                                                    ? ' bg-warning-subtle text-warning-emphasis'
                                                    : ''
                                    }">

                                    <!-- 緊急度アイコン -->
                                    <span
                                        th:text="${task.expired
                                            ? '🚨'
                                            : !task.deadline.isAfter(threeDaysLater)
                                                ? '⚠️'
                                                : '⏰'}">
                                    </span>

                                    <!-- 時間 -->
                                    <span th:text="${task.time}">
                                        23:59
                                    </span>

                                    <!-- タスク名 -->
                                    <span
                                        class="ms-2 fw-semibold"
                                        th:text="${group.title}">
                                        タスク名
                                    </span>

                                    <!-- 詳細 -->
                                    <div
                                        class="ms-4 mt-1"
                                        th:if="${task.description != null
                                            && !task.description.isBlank()}">

                                        <span>
                                            📝
                                        </span>

                                        <span th:text="${task.description}">
                                            詳細
                                        </span>

                                    </div>

                                </div>

                            </div>

                            <div th:if="${group.tasks.size() > 1}">

                                <!-- タスク名 -->
                                <div class="fw-semibold mb-1">

                                    <span>
                                        ⏰
                                    </span>

                                    <span th:text="${group.title}">
                                        タスク名
                                    </span>

                                </div>

                                <!-- 時間・詳細一覧 -->
                                <div
                                    class="ms-4"
                                    th:each="task : ${group.tasks}">

                                    <div
                                        class="rounded p-2 mb-1"
                                        th:classappend="${
                                            task.expired
                                                ? ' bg-danger text-white'
                                                : task.deadline.isEqual(today)
                                                    ? ' bg-danger-subtle text-danger-emphasis'
                                                    : !task.deadline.isAfter(threeDaysLater)
                                                        ? ' bg-warning-subtle text-warning-emphasis'
                                                        : ''
                                        }">

                                        <!-- 緊急度アイコン -->
                                        <span
                                            th:text="${task.expired
                                                ? '🚨'
                                                : !task.deadline.isAfter(threeDaysLater)
                                                    ? '⚠️'
                                                    : '⏰'}">
                                        </span>

                                        <!-- 時間 -->
                                        <span th:text="${task.time}">
                                            23:59
                                        </span>

                                        <!-- 詳細 -->
                                        <span
                                            class="ms-2"
                                            th:if="${task.description != null
                                                && !task.description.isBlank()}"
                                            th:text="${task.description}">
                                            詳細
                                        </span>

                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
