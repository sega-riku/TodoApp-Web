<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <title>タスク追加</title>
</head>

<body>

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card">

                    <div class="card-body">

                        <h2 class="card-title mb-4">
                            タスク追加
                        </h2>

                        <form action="/add" method="post">

                            <!-- タスク名 -->
                            <div class="mb-3">

                                <label class="form-label">
                                    タスク名
                                </label>

                                <input
                                    type="text"
                                    name="title"
                                    class="form-control"
                                    required>

                            </div>

                            <!-- 区分 + 日付 -->
                            <div class="row g-3 mb-3">

                                <div class="col-4">

                                    <label class="form-label">
                                        予定・締切区分
                                    </label>

                                    <select
                                        name="dateType"
                                        class="form-select"
                                        required>

                                        <option value="SCHEDULE">
                                            予定
                                        </option>

                                        <option value="DEADLINE">
                                            締切
                                        </option>

                                    </select>

                                </div>

                                <div class="col-8">

                                    <label class="form-label">
                                        日付
                                    </label>

                                    <input
                                        type="date"
                                        name="deadline"
                                        class="form-control"
                                        onclick="this.showPicker()"
                                        required>

                                </div>

                            </div>

                            <!-- 時間 -->
                            <div class="mb-4">

                                <label class="form-label">
                                    時間
                                </label>

                                <input
                                    type="time"
                                    name="time"
                                    class="form-control"
                                    onclick="this.showPicker()"
                                    required>

                            </div>

                            <button
                                type="submit"
                                class="btn btn-success me-2">
                                登録
                            </button>

                            <a
                                th:href="@{/}"
                                class="btn btn-secondary">
                                一覧へ戻る
                            </a>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
