<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        @media(max-width: 991.98px){
            .edit-page{
                padding-top: 9rem !important;
            }
        }
    </style>

    <title>タスク編集</title>
</head>

<body>

    <div class="container py-5 edit-page">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card">

                    <div class="card-body">

                        <h2 class="card-title mb-4">
                            タスク編集
                        </h2>

                        <form
                            th:action="@{/edit/{id}(id=${task.id})}"
                            method="post">

                            <!--タスク名-->
                            <div class="mb-3">

                            <div
                                th:if="${timeError}"
                                class="alert alert-danger"
                                th:text="${timeError}">
                            </div>

                                <label class="form-label">
                                    タスク名
                                </label>

                                <input
                                    type="text"
                                    name="title"
                                    class="form-control"
                                    th:value="${task.title}"
                                    required>

                            </div>

                            <!--予定・締切区分 + 日付-->
                            <div class="row g-3 mb-3">

                                <!--予定・締切区分-->
                                <div class="col-5 col-md-4">

                                    <label class="form-label">
                                        予定・締切区分
                                    </label>

                                    <select
                                        id="dateType"
                                        name="dateType"
                                        class="form-select"
                                        required>

                                        <option
                                            value="SCHEDULE"
                                            th:selected="${task.dateType == T(com.sega.todoappweb.task.DateType).SCHEDULE}">
                                            予定
                                        </option>

                                        <option
                                            value="DEADLINE"
                                            th:selected="${task.dateType == T(com.sega.todoappweb.task.DateType).DEADLINE}">
                                            締切
                                        </option>

                                    </select>

                                </div>

                                <!--日付-->
                                <div class="col-7 col-md-8">

                                    <label class="form-label">
                                        日付
                                    </label>

                                    <input
                                        type="date"
                                        name="deadline"
                                        class="form-control"
                                        th:value="${task.deadline}"
                                        onclick="this.showPicker()"
                                        required>

                                </div>

                            </div>

                            <!--時間-->
                            <div class="mb-4">

                                <label class="form-label">
                                    <span id="timeLabel">
                                        開始時間
                                    </span>
                                    
                                    <span class="text-secondary">
                                        (任意)
                                    </span>
                                </label>

                                <input
                                    type="time"
                                    name="time"
                                    class="form-control"
                                    th:value="${task.time}"
                                    onclick="this.showPicker()">

                                <div id="endTimeArea" class="mt-3">
                                    <label class="form-label">
                                        終了時間
                                        <span class="text-secondary">
                                            (任意)
                                        </span>
                                    </label>

                                    <input
                                        type="time"
                                        name="endTime"
                                        class="form-control"
                                        th:value="${task.endTime}"
                                        onclick="this.showPicker()">                                    
                                </div>
                            </div>

                            <!--詳細・備考-->
                            <div class="mb-4">

                                <label class="form-label">
                                    詳細・備考
                                    <span class="text-secondary">
                                        (任意)
                                    </span>
                                </label>

                                <textarea
                                    name="description"
                                    class="form-control"
                                    rows="3"
                                    placeholder="詳細やメモを入力"
                                    th:text="${task.description}"></textarea>

                            </div>

                            <button
                                type="submit"
                                class="btn btn-info text-white me-2">
                                更新
                            </button>

                            <a
                                th:href="@{/}"
                                class="btn btn-secondary">
                                一覧へ戻る
                            </a>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>

        const dateType =
            document.getElementById("dateType");

        const timeLabel =
            document.getElementById("timeLabel");

        const endTimeArea =
            document.getElementById("endTimeArea");

        const endTime =
            document.getElementById("endTime");

        //時間表示切り替え
        function toggleEndTime() {

            if (dateType.value === "SCHEDULE") {

                timeLabel.textContent =
                    "開始時間";

                endTimeArea.style.display =
                    "block";

            } else {

                timeLabel.textContent =
                    "締切時間";

                endTimeArea.style.display =
                    "none";

                endTime.value =
                    "";

            }
        }

        //予定・締切区分変更時
        dateType.addEventListener(
            "change",
            toggleEndTime
        );

        //初期表示
        toggleEndTime();

    </script>

</body>

</html>
