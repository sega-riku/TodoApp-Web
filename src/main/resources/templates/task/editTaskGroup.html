<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        @media(max-width: 991.98px){
            .edit-page{
                padding-top: 8rem !important;
            }
        }
    </style>

    <title>タスク全体編集</title>
</head>

<body>

    <div class="container py-5 edit-page">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card">

                    <div class="card-body">

                        <h2 class="card-title mb-4">
                            タスク全体編集
                        </h2>

                        <p class="text-secondary mb-4">
                            このタスク全体に共通する情報を変更します。
                            
                        </p>

                        <form
                            th:action="@{/edit/group/{id}(id=${task.id})}"
                            method="post">

                            <!--タスク名-->
                            <div class="mb-3">

                                <label class="form-label">
                                    タスク名
                                </label>

                                <input
                                    type="text"
                                    name="title"
                                    class="form-control"
                                    th:value="${task.title}"
                                    required>

                            </div>

                            <!--予定・締切区分 + 日付-->
                            <div class="row g-3 mb-4">

                                <!--予定・締切区分-->
                                <div class="col-6 col-md-4">

                                    <label class="form-label">
                                        予定・締切区分
                                    </label>

                                    <select
                                        name="dateType"
                                        class="form-select"
                                        required>

                                        <option
                                            value="SCHEDULE"
                                            th:selected="${task.dateType
                                                == T(com.sega.todoappweb.task.DateType).SCHEDULE}">
                                            予定
                                        </option>

                                        <option
                                            value="DEADLINE"
                                            th:selected="${task.dateType
                                                == T(com.sega.todoappweb.task.DateType).DEADLINE}">
                                            締切
                                        </option>

                                    </select>

                                </div>

                                <!--日付-->
                                <div class="col-7 col-md-8">

                                    <label class="form-label">
                                        日付
                                    </label>

                                    <input
                                        type="date"
                                        name="deadline"
                                        class="form-control"
                                        th:value="${task.deadline}"
                                        onclick="this.showPicker()"
                                        required>

                                </div>

                            </div>

                            <!--変更対象の説明-->
                            <div class="alert alert-info">

                                <p class="mb-1 fw-semibold">
                                    変更される項目
                                </p>

                                <p class="mb-0">
                                    タスク名・予定/締切区分・日付が、
                                    同じグループ内のすべての予定・締切に反映されます。
                                </p>

                            </div>

                            <!--ボタン-->
                            <div class="d-flex gap-2">

                                <button
                                    type="submit"
                                    class="btn btn-primary">
                                    変更
                                </button>

                                <a
                                    th:href="@{/}"
                                    class="btn btn-secondary">
                                    一覧へ戻る
                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
