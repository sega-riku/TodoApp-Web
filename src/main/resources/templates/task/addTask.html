<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">
        
    <style>
        @media(max-width: 991.98px){
            .add-page{
                padding-top: 9rem !important;
            }
        }
    </style>

    <title>タスク追加</title>
</head>

<body>

    <div class="container py-5 add-page">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card">

                    <div class="card-body">

                        <h2 class="card-title mb-4">
                            タスク追加
                        </h2>

                        <!--時間入力エラー-->
                        <div
                            th:if="${timeError}"
                            class="alert alert-danger"
                            th:text="${timeError}">
                        </div>

                        <form
                            th:action="@{/add}"
                            method="post">

                            <!--タスク名-->
                            <div class="mb-3">

                                <label class="form-label">
                                    タスク名
                                </label>

                                <input
                                    type="text"
                                    name="title"
                                    class="form-control"
                                    th:value="${enteredTitle}"
                                    required>

                            </div>

                            <!--予定・締切区分 + 日付-->
                            <div class="row g-3 mb-3">

                                <!--予定・締切区分-->
                                <div class="col-5 col-md-4">

                                    <label class="form-label">
                                        予定・締切区分
                                    </label>

                                    <select
                                        id="dateType"
                                        name="dateType"
                                        class="form-select"
                                        required>

                                        <option
                                            value="SCHEDULE"
                                            th:selected="${enteredDateType != null
                                                ? enteredDareType.name() == 'SCHEDULE'
                                                : selectedDateType == null
                                                    || selectedDateType.name() == 'SCHEDULE'}">
                                            予定
                                        </option>

                                        <option
                                            value="DEADLINE"
                                            th:selected="${enteredDateType != null
                                                ? enteredDateType.name() == 'DEADLINE'
                                                : selectedDateType != null
                                                    && selectedDateType.name() == 'DEADLINE'}">
                                            締切
                                        </option>

                                    </select>

                                </div>

                                <!--日付-->
                                <div class="col-7 col-md-8">

                                    <label class="form-label">
                                        日付
                                    </label>

                                    <!--エラー後の再表示-->
                                    <input
                                        th:if="${enteredDeadline != null}"
                                        type="date"
                                        name="deadline"
                                        class="form-control"
                                        th:value="${enteredDeadline}"
                                        onclick="this.showPicker()"
                                        required>

                                    <!--通常のタスク追加-->
                                    <input
                                        th:if="${enteredDeadline == null
                                            && selectedDeadline == null}"
                                        type="date"
                                        name="deadline"
                                        class="form-control"
                                        onclick="this.showPicker()"
                                        required>

                                    <!--この日のタスク追加-->
                                    <input
                                        th:if="${enteredDeadline == null
                                            && selectedDeadline != null}"
                                        type="date"
                                        class="form-control"
                                        th:value="${selectedDeadline}"
                                        disabled>

                                    <!--固定日付送信用-->
                                    <input
                                        th:if="${enteredDeadline == null
                                            && selectedDeadline != null}"
                                        type="hidden"
                                        name="deadline"
                                        th:value="${selectedDeadline}">

                                </div>

                            </div>

                            <!--時間-->
                            <div class="mb-4">

                                <!--開始時間・締切時間-->
                                <label class="form-label">

                                    <span id="timeLabel">
                                        開始時間
                                    </span>

                                    <span class="text-secondary">
                                        (任意)
                                    </span>

                                </label>

                                <input
                                    type="time"
                                    name="time"
                                    class="form-control"
                                    th:value="${enteredTime}"
                                    onclick="this.showPicker()">

                                <!--終了時間-->
                                <div
                                    id="endTimeArea"
                                    class="mt-3">

                                    <label class="form-label">
                                        終了時間
                                        <span class="text-secondary">
                                            (任意)
                                        </span>
                                    </label>

                                    <input
                                        type="time"
                                        id="endTime"
                                        name="endTime"
                                        class="form-control"
                                        th:value="${enteredEndTime}"
                                        onclick="this.showPicker()">

                                </div>

                            </div>

                            <!--詳細・備考-->
                            <div class="mb-4">

                                <label class="form-label">
                                    詳細・備考
                                    <span class="text-secondary">
                                        (任意)
                                    </span>
                                </label>

                                <textarea
                                    name="description"
                                    class="form-control"
                                    rows="3"
                                    placeholder="詳細やメモを入力"
                                    th:text="${enteredDescription}"></textarea>

                            </div>

                            <button
                                type="submit"
                                class="btn btn-success me-2">
                                登録
                            </button>

                            <a
                                th:href="@{/}"
                                class="btn btn-secondary">
                                一覧へ戻る
                            </a>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>

        const dateType =
            document.getElementById("dateType");

        const timeLabel =
            document.getElementById("timeLabel");

        const endTimeArea =
            document.getElementById("endTimeArea");

        const endTime =
            document.getElementById("endTime");

        //時間表示切り替え
        function toggleEndTime() {

            if (dateType.value === "SCHEDULE") {

                timeLabel.textContent =
                    "開始時間";

                endTimeArea.style.display =
                    "block";

            } else {

                timeLabel.textContent =
                    "締切時間";

                endTimeArea.style.display =
                    "none";

                endTime.value =
                    "";

            }

        }

        //予定・締切区分変更時
        dateType.addEventListener(
            "change",
            toggleEndTime
        );

        //初期表示
        toggleEndTime();

    </script>

</body>

</html>
