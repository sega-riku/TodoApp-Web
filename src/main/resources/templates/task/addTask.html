<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">
        
    <style>
        @media(max-width: 991.98px){
            .add-page{
                padding-top: 9rem !important;
            }
        }
    </style>

    <title>タスク追加</title>
</head>

<body>

    <div class="container py-5 add-page">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card">

                    <div class="card-body">

                        <h2 class="card-title mb-4">
                            タスク追加
                        </h2>

                        <form
                            th:action="@{/add}"
                            method="post">

                            <!--タスク名-->
                            <div class="mb-3">

                                <label class="form-label">
                                    タスク名
                                </label>

                                <input
                                    type="text"
                                    name="title"
                                    class="form-control"
                                    required>

                            </div>

                            <!--予定・締切区分 + 日付-->
                            <div class="row g-3 mb-3">

                                <!--予定・締切区分-->
                                <div class="col-5 col-md-4">

                                    <label class="form-label">
                                        予定・締切区分
                                    </label>

                                    <select
                                        name="dateType"
                                        class="form-select"
                                        required>

                                        <option value="SCHEDULE">
                                            予定
                                        </option>

                                        <option value="DEADLINE">
                                            締切
                                        </option>

                                    </select>

                                </div>

                                <!--日付-->
                                <div class="col-7 col-md-8">

                                    <label class="form-label">
                                        日付
                                    </label>

                                    <!--通常のタスク追加の場合-->
                                    <input
                                        th:if="${selectedDeadline == null}"
                                        type="date"
                                        name="deadline"
                                        class="form-control"
                                        onclick="this.showPicker()"
                                        required>

                                    <!--この日のタスク追加の場合-->
                                    <input
                                        th:if="${selectedDeadline != null}"
                                        type="date"
                                        class="form-control"
                                        th:value="${selectedDeadline}"
                                        disabled>

                                    <!--固定日付送信用-->
                                    <input
                                        th:if="${selectedDeadline != null}"
                                        type="hidden"
                                        name="deadline"
                                        th:value="${selectedDeadline}">

                                </div>

                            </div>

                            <!--時間-->
                            <div class="mb-4">

                                <label class="form-label">
                                    時間
                                    <span class="text-secondary">
                                        (任意)
                                    </span>
                                </label>

                                <input
                                    type="time"
                                    name="time"
                                    class="form-control"
                                    onclick="this.showPicker()">

                            </div>

                            <!--詳細・備考-->
                            <div class="mb-4">

                                <label class="form-label">
                                    詳細・備考
                                    <span class="text-secondary">
                                        (任意)
                                    </span>
                                </label>

                                <textarea
                                    name="description"
                                    class="form-control"
                                    rows="3"
                                    placeholder="詳細やメモを入力"></textarea>

                            </div>

                            <button
                                type="submit"
                                class="btn btn-success me-2">
                                登録
                            </button>

                            <a
                                th:href="@{/}"
                                class="btn btn-secondary">
                                一覧へ戻る
                            </a>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
