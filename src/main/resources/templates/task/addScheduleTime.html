<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        @media(max-width: 991.98px){
            .time-add-page{
                padding-top:9rem !important;
            }
        }
    </style>

    <title>時間・詳細追加</title>
</head>

<body>

    <div class="container py-5 time-add-page">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card">

                    <div class="card-body">

                        <h2 class="card-title mb-4">
                            時間・詳細を追加
                        </h2>

                        <!--元のタスク情報-->
                        <div class="mb-4">

                            <!--タスク名-->
                            <p class="mb-2">

                                <strong>
                                    タスク名：
                                </strong>

                                <span th:text="${task.title}">
                                    タスク名
                                </span>

                            </p>

                            <!--予定・締切区分-->
                            <p class="mb-2">

                                <strong>
                                    区分：
                                </strong>

                                <span
                                    th:text="${task.dateType
                                        == T(com.sega.todoappweb.task.DateType).SCHEDULE
                                        ? '📅 予定'
                                        : '⏰ 締切'}">
                                    📅 予定
                                </span>

                            </p>

                            <!--日付-->
                            <p class="mb-0">

                                <strong>
                                    日付：
                                </strong>

                                <span th:text="${task.deadline}">
                                    2026-08-31
                                </span>

                            </p>

                        </div>

                        <!--入力エラー-->
                        <div
                            th:if="${taskTimeAddError}"
                            class="alert alert-danger"
                            th:text="${taskTimeAddError}">
                            時間または詳細を入力してください。
                        </div>

                        <!--時間・詳細追加フォーム-->
                        <form
                            th:action="@{/task/time/add/{id}(id=${task.id})}"
                            method="post">

                            <!--時間-->
                            <div class="mb-3">

                                <label class="form-label">
                                    時間
                                    <span class="text-secondary">
                                        (任意)
                                    </span>
                                </label>

                                <input
                                    type="time"
                                    name="time"
                                    class="form-control"
                                    onclick="this.showPicker()">

                            </div>

                            <!--詳細・備考-->
                            <div class="mb-4">

                                <label class="form-label">
                                    詳細・備考
                                    <span class="text-secondary">
                                        (任意)
                                    </span>
                                </label>

                                <textarea
                                    name="description"
                                    class="form-control"
                                    rows="3"
                                    placeholder="詳細やメモを入力"></textarea>

                            </div>

                            <p class="text-secondary small">
                                時間または詳細のどちらかを入力してください。
                            </p>

                            <!--追加-->
                            <button
                                type="submit"
                                class="btn btn-success me-2">
                                追加
                            </button>

                            <!--一覧へ戻る-->
                            <a
                                th:href="@{/}"
                                class="btn btn-secondary">
                                一覧へ戻る
                            </a>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
